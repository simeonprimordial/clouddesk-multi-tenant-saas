AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudDesk multi-tenant SaaS backend.
  Provides a serverless HTTP API using AWS Lambda and Amazon API Gateway.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment name

  DatabaseSecretArn:
    Type: String
    Description: ARN of the CloudDesk PostgreSQL secret in AWS Secrets Manager
    NoEcho: true  

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC containing the CloudDesk RDS database

  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group currently attached to the CloudDesk RDS database  

  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs used by the CloudDesk Lambda functions


Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 256
    Timeout: 10

    Environment:
      Variables:
        APP_ENV: !Ref Environment
        LOG_LEVEL: INFO
        # COGNITO_USER_POOL_ID: !Ref UserPool
        # COGNITO_APP_CLIENT_ID: !Ref UserPoolClient


    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN

    Tags:
      Application: CloudDesk
      Environment: !Ref Environment
      ManagedBy: AWS-SAM

Resources:


  ############################################
  # CloudWatch Log Groups
  ############################################

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-health
      RetentionInDays: 30

  DatabaseTestFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-database-test
      RetentionInDays: 30

  MeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-me
      RetentionInDays: 30

  UserProvisioningFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-user-provisioning
      RetentionInDays: 30

  CreateTenantFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-create-tenant
      RetentionInDays: 30

  ListTenantsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-list-tenants
      RetentionInDays: 30

  GetTenantFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-get-tenant
      RetentionInDays: 30

  ListMembersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-list-members
      RetentionInDays: 30

  AddMemberFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-add-member
      RetentionInDays: 30

  UpdateMemberFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-update-member
      RetentionInDays: 30

  RemoveMemberFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/clouddesk-${Environment}-remove-member
      RetentionInDays: 30

  ############################################
  # API Gateway HTTP API
  ############################################

  CloudDeskHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment

      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
              audience:
                - !Ref UserPoolClient

      Tags:
        Application: CloudDesk
        Environment: !Ref Environment
        ManagedBy: AWS-SAM

  ############################################
  # Amazon Cognito
  ############################################

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub clouddesk-${Environment}-users

      LambdaConfig:
        PostConfirmation: !GetAtt UserProvisioningFunction.Arn

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      UserPoolTags:
        Application: CloudDesk
        Environment: !Ref Environment
        ManagedBy: AWS-SAM


  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub clouddesk-${Environment}-client

      UserPoolId: !Ref UserPool

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      PreventUserExistenceErrors: ENABLED

      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
  
  ############################################
  # Shared Lambda Layer
  ############################################

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub clouddesk-${Environment}-shared
      Description: Shared CloudDesk libraries

      ContentUri: layers/shared/

      CompatibleRuntimes:
        - python3.13

      CompatibleArchitectures:
        - x86_64

      RetentionPolicy: Delete


  ############################################
  # Health Lambda Function
  ############################################

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-health

      Layers:
        - !Ref SharedLayer

      Description: >
        Public health-check endpoint for the CloudDesk backend.

      CodeUri: health/
      Handler: handler.lambda_handler

      Events:
        HealthEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /health
            Method: GET
      


  ############################################
  # Database Connectivity Test Function
  ############################################

  DatabaseTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-database-test
      
      Layers:
        - !Ref SharedLayer

      Description: >
        Tests secure retrieval of CloudDesk PostgreSQL credentials
        from AWS Secrets Manager.

      CodeUri: database_test/
      Handler: handler.lambda_handler

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn  

      Events:
        DatabaseTestEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /database-test
            Method: GET 

            Auth:
              Authorizer: CognitoJwtAuthorizer   


  ############################################
  # Cognito User Provisioning Function
  ############################################

  UserProvisioningFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-user-provisioning

      Description: >
        Creates a CloudDesk database user after
        successful Cognito user confirmation.

      CodeUri: user_provisioning/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds

        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn


  ############################################
  # Current User Function
  ############################################

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-me

      Description: >
        Returns the authenticated CloudDesk user's application profile.

      CodeUri: me/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn

      Events:
        MeEndpoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /me
            Method: GET

            Auth:
              Authorizer: CognitoJwtAuthorizer


  ############################################
  # Create Tenant Function
  ############################################

  CreateTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-create-tenant

      Description: >
        Creates a new tenant and assigns the authenticated user
        as the tenant owner.

      CodeUri: create_tenant/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn

      Events:
        CreateTenant:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /tenants
            Method: POST

            Auth:
              Authorizer: CognitoJwtAuthorizer



  ############################################
  # List Tenants Function
  ############################################

  ListTenantsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-list-tenants

      Description: >
        Returns the active tenants available to the authenticated user.

      CodeUri: list_tenants/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn

      Events:
        ListTenants:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /tenants
            Method: GET

            Auth:
              Authorizer: CognitoJwtAuthorizer


  ############################################
  # Get Tenant Function
  ############################################

  GetTenantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-get-tenant

      Description: >
        Returns a single tenant that the authenticated
        user belongs to.

      CodeUri: get_tenant/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn

      Events:
        GetTenant:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /tenants/{tenantId}
            Method: GET

            Auth:
              Authorizer: CognitoJwtAuthorizer

  ############################################
  # List Members Function
  ############################################

  ListMembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-list-members

      Description: >
        Returns all active members belonging to a tenant.

      CodeUri: list_members/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn

      Events:
        ListMembers:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /tenants/{tenantId}/members
            Method: GET

            Auth:
              Authorizer: CognitoJwtAuthorizer


  ############################################
  # Add Member Function
  ############################################

  AddMemberFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-add-member

      Description: >
        Adds an existing CloudDesk user to a tenant.

      CodeUri: add_member/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn

      Events:
        AddMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /tenants/{tenantId}/members
            Method: POST

            Auth:
              Authorizer: CognitoJwtAuthorizer


  ############################################
  # Update Member Function
  ############################################

  UpdateMemberFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-update-member

      Description: >
        Updates the role of an existing tenant member.

      CodeUri: update_member/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn

      Events:
        UpdateMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /tenants/{tenantId}/members/{userId}
            Method: PUT

            Auth:
              Authorizer: CognitoJwtAuthorizer


  ############################################
  # Remove Member Function
  ############################################

  RemoveMemberFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub clouddesk-${Environment}-remove-member

      Description: >
        Removes a tenant member by marking the membership inactive.

      CodeUri: remove_member/
      Handler: handler.lambda_handler

      Layers:
        - !Ref SharedLayer

      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn

      VpcConfig:
        SubnetIds: !Ref LambdaSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn

      Events:
        RemoveMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudDeskHttpApi
            Path: /tenants/{tenantId}/members/{userId}
            Method: DELETE

            Auth:
              Authorizer: CognitoJwtAuthorizer


  ############################################
  # Allow Cognito to invoke provisioning Lambda
  ############################################

  UserProvisioningPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction

      FunctionName: !Ref UserProvisioningFunction

      Principal: cognito-idp.amazonaws.com

      SourceArn: !GetAtt UserPool.Arn


  ############################################
  # Lambda Security Group
  ############################################

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudDesk database-connected Lambdas
      VpcId: !Ref VpcId

      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub clouddesk-${Environment}-lambda-sg
        - Key: Application
          Value: CloudDesk
        - Key: Environment
          Value: !Ref Environment

  LambdaToRdsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Allow CloudDesk Lambda functions to connect to PostgreSQL

  ############################################
  # Secrets Manager VPC Endpoint Security Group
  ############################################

  SecretsManagerEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Secrets Manager Interface Endpoint
      VpcId: !Ref VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub clouddesk-${Environment}-secrets-endpoint-sg

  ############################################
  # Secrets Manager Interface Endpoint
  ############################################

  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface

      VpcId: !Ref VpcId

      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager

      PrivateDnsEnabled: true

      SecurityGroupIds:
        - !Ref SecretsManagerEndpointSecurityGroup

      SubnetIds: !Ref LambdaSubnetIds

      Tags:
        - Key: Name
          Value: !Sub clouddesk-${Environment}-secretsmanager-endpoint


Outputs:

  CloudDeskApiUrl:
    Description: CloudDesk HTTP API base URL
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}

  HealthEndpointUrl:
    Description: CloudDesk health-check endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/health

  HealthFunctionArn:
    Description: ARN of the CloudDesk health Lambda function
    Value: !GetAtt HealthFunction.Arn

  HealthFunctionRoleArn:
    Description: ARN of the IAM role generated for the health function
    Value: !GetAtt HealthFunctionRole.Arn
  
  DatabaseTestFunctionArn:
    Description: ARN of the CloudDesk database connectivity test function
    Value: !GetAtt DatabaseTestFunction.Arn
  
  CognitoUserPoolId:
    Description: CloudDesk Cognito User Pool ID
    Value: !Ref UserPool

  CognitoUserPoolArn:
    Description: CloudDesk Cognito User Pool ARN
    Value: !GetAtt UserPool.Arn

  CognitoAppClientId:
    Description: CloudDesk Cognito App Client ID
    Value: !Ref UserPoolClient 

  MeEndpointUrl:
    Description: Authenticated CloudDesk user profile endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/me

  CreateTenantEndpointUrl:
    Description: Create Tenant endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/tenants

  ListTenantsEndpointUrl:
    Description: List Tenants endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/tenants   

  GetTenantEndpointUrl:
    Description: Get Tenant endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/tenants/{tenantId}

  ListMembersEndpointUrl:
    Description: List Members endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/tenants/{tenantId}/members

  AddMemberEndpointUrl:
    Description: Add Member endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/tenants/{tenantId}/members

  UpdateMemberEndpointUrl:
    Description: Update Member endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/tenants/{tenantId}/members/{userId}

  RemoveMemberEndpointUrl:
    Description: Remove Member endpoint
    Value: !Sub >
      https://${CloudDeskHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/tenants/{tenantId}/members/{userId}    