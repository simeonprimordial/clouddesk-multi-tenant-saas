name: CloudDesk Deployment

on:
  workflow_run:
    workflows:
      - CloudDesk CI
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: clouddesk-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CloudDesk Backend

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2


      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl --silent \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(python -c \
            'import json,sys; print(json.load(sys.stdin)["value"])' \
            <<< "$TOKEN_RESPONSE")

          TOKEN="$TOKEN" python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("issuer:", claims.get("iss"))
          print("audience:", claims.get("aud"))
          print("subject:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("ref:", claims.get("ref"))
          PY


      - name: Show OIDC subject claim
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString()
            );

            console.log("SUB:", payload.sub);
            console.log("AUD:", payload.aud);


      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: CloudDeskDeployment

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Build SAM Application
        run: sam build

      - name: Deploy CloudDesk
        run: >
          sam deploy
          --stack-name clouddesk-backend
          --region "${{ vars.AWS_REGION }}"
          --capabilities CAPABILITY_IAM
          --parameter-overrides
          Environment=dev
          DatabaseSecretArn="${{ vars.DATABASE_SECRET_ARN }}"
          VpcId=vpc-0f5bbd66ff9fa24f8
          RdsSecurityGroupId=sg-05dc391dd52d0d63b
          LambdaSubnetIds="subnet-078f2418a092901fd,subnet-045b3b611cdf127b0"
          --no-confirm-changeset
          --no-fail-on-empty-changeset